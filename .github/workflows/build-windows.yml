name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify release commit identity
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          $authorName = git log -1 --format='%an'
          $authorEmail = git log -1 --format='%ae'
          $committerName = git log -1 --format='%cn'
          $committerEmail = git log -1 --format='%ce'
          Write-Host "Author: $authorName <$authorEmail>"
          Write-Host "Committer: $committerName <$committerEmail>"
          if ($authorName -ne '4geg' -or $authorEmail -ne '264871936+4geg@users.noreply.github.com' -or $committerName -ne '4geg' -or $committerEmail -ne '264871936+4geg@users.noreply.github.com') {
            Write-Error 'Release blocked: Git author/committer must be 4geg with the configured GitHub noreply address.'
            exit 1
          }

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Ensure icon exists
        shell: powershell
        run: |
          if (-not (Test-Path "assets/app.ico")) {
            python tools/make_icon.py
          } else {
            Write-Host "Using existing assets/app.ico"
          }

      - name: Syntax check
        run: python -m py_compile main.py ofd_app.py config_store.py version.py

      - name: Build EXE
        shell: cmd
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed --noupx
          --name "1OFD_FiscalDocs"
          --icon "assets\app.ico"
          --version-file "assets\version_info.txt"
          --manifest "assets\app.manifest"
          --add-data "assets\app.ico;assets"
          --collect-all uvicorn
          --collect-all fastapi
          --collect-all pydantic
          --collect-all httpx
          --collect-data certifi
          --collect-all pystray
          --collect-all PIL
          main.py

      - name: Create SHA256 checksum
        shell: powershell
        run: |
          $appVersion = python -c "from version import VERSION; print(VERSION)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exeName = "1OFD_FiscalDocs_$($appVersion.Trim()).exe"
          Rename-Item -LiteralPath "dist/1OFD_FiscalDocs.exe" -NewName $exeName
          $hash = (Get-FileHash "dist/$exeName" -Algorithm SHA256).Hash.ToLower()
          "$hash  $exeName" | Set-Content -Encoding ascii "dist/SHA256SUMS.txt"
          "APP_VERSION=$($appVersion.Trim())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1OFD_FiscalDocs-v${{ env.APP_VERSION }}-Windows
          path: |
            dist/1OFD_FiscalDocs_*.exe
            dist/SHA256SUMS.txt

      - name: Attach EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/1OFD_FiscalDocs_*.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
