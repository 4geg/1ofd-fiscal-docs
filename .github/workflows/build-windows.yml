name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Ensure icon exists
        shell: powershell
        run: |
          if (-not (Test-Path "assets/app.ico")) {
            python tools/make_icon.py
          } else {
            Write-Host "Using existing assets/app.ico"
          }

      - name: Syntax check
        run: python -m py_compile main.py ofd_app.py config_store.py version.py

      - name: Build EXE
        shell: cmd
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "1OFD_FiscalDocs"
          --icon "assets\app.ico"
          --add-data "assets\app.ico;assets"
          --collect-all uvicorn
          --collect-all fastapi
          --collect-all pydantic
          --collect-all httpx
          --collect-data certifi
          --collect-all pystray
          --collect-all PIL
          main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1OFD_FiscalDocs-v1.7.1-Windows
          path: dist/1OFD_FiscalDocs.exe

      - name: Attach EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/1OFD_FiscalDocs.exe
          generate_release_notes: true
